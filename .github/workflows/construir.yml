# Construye los ejecutables de Windows y Linux en los servidores de GitHub.
# Se ejecuta a mano (pestaña Actions -> "Construir ejecutables" -> Run workflow) o al
# publicar una etiqueta vX.Y.Z. Los ZIP quedan como "Artifacts" del run y, si es una
# etiqueta, también en la página Releases para descargarlos directamente.
name: Construir ejecutables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04      # se construye en una versión antigua para que funcione en distribuciones nuevas
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
      - name: Pruebas
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # En Windows, Qt puede cerrar el proceso con error al terminar Python aunque todas las
        # pruebas pasen; por eso el resultado se lee del informe JUnit y no del código de salida.
        run: |
          python -m pytest -q --junitxml=resultado-pruebas.xml || true
          python -c "import sys, xml.etree.ElementTree as ET; r = ET.parse('resultado-pruebas.xml').getroot(); s = r if r.tag == 'testsuite' else r[0]; f = int(s.get('failures')) + int(s.get('errors')); print('pruebas:', s.get('tests'), 'fallas:', f); sys.exit(1 if f or int(s.get('tests')) == 0 else 0)"
      - name: Construir
        run: python empaquetar/construir.py
      - uses: actions/upload-artifact@v4
        with:
          name: EditorATS-${{ matrix.os }}
          path: dist/*.zip

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ejecutables
          merge-multiple: true
      - name: Crear la versión (Release) con los ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ejecutables/*.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Ejecutables para Windows y Linux."
