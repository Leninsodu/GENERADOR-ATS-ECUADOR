[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atsapp"
version = "1.0.1"
description = "Editor y validador del Anexo Transaccional Simplificado (ATS) del SRI de Ecuador, multiplataforma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atsapp-cli = "atsapp.__main__:main"

[project.gui-scripts]
atsapp = "atsapp.__main__:main"

[tool.setuptools.packages.find]
include = ["atsapp*"]

[tool.setuptools.package-data]
atsapp = ["datos/*.yaml", "datos/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
