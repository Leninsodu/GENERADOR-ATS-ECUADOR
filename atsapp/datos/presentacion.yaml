# Columnas que se muestran en las tablas principales (el resto se edita en el formulario)
columnas:
  detalleCompras: [tpIdProv, idProv, tipoComprobante, establecimiento, puntoEmision, secuencial, fechaEmision, fechaRegistro, codSustento, baseImpGrav, baseImponible, montoIva]
  detalleVentas: [tpIdCliente, idCliente, tipoComprobante, tipoEmision, numeroComprobantes, baseImpGrav, baseImponible, baseNoGraIva, montoIva, valorRetIva, valorRetRenta]
  ventaEst: [codEstab, ventasEstab, ivaComp]
  detalleAnulados: [tipoComprobante, establecimiento, puntoEmision, secuencialInicio, secuencialFin, autorizacion]
  detalleExportaciones: [tpIdClienteEx, idClienteEx, exportacionDe, tipoComprobante, fechaEmbarque, valorFOB, valorFOBComprobante]

# Columnas numéricas que se suman en la barra de totales de cada tabla
totales:
  detalleCompras: [baseImpGrav, baseImponible, baseNoGraIva, montoIva]
  detalleVentas: [baseImpGrav, baseImponible, baseNoGraIva, montoIva]
  ventaEst: [ventasEstab, ivaComp]
  detalleExportaciones: [valorFOB, valorFOBComprobante]

